<div class="dashboard-container">
  <h1 class="main-title">SISTEMA DE GESTIÓN DE ALUMNOS</h1>
  
  <div class="content-wrapper">
    <!-- Panel Izquierdo: Formulario -->
    <div class="form-panel">
      <h2 class="form-title">REGISTRAR ALUMNO</h2>
      
      <form (ngSubmit)="guardar()" class="form-content">
        <!-- ID Único -->
        <div class="form-group">
          <label for="id">ID Único</label>
          <input 
            type="text" 
            id="id" 
            name="id" 
            [(ngModel)]="alumnoSeleccionado.id"
            placeholder="1"
            class="form-input">
        </div>

        <!-- Número de Control -->
        <div class="form-group">
          <label for="numeroControl">Número de Control</label>
          <input 
            type="text" 
            id="numeroControl" 
            name="numeroControl" 
            [(ngModel)]="alumnoSeleccionado.numeroControl"
            placeholder="22620056"
            class="form-input">
        </div>

        <!-- Nombre -->
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input 
            type="text" 
            id="nombre" 
            name="nombre" 
            [(ngModel)]="alumnoSeleccionado.nombre"
            placeholder="Nombre"
            class="form-input">
        </div>

        <!-- Apellido -->
        <div class="form-group">
          <label for="apellido">Apellidos</label>
          <input 
            type="text" 
            id="apellido" 
            name="apellido" 
            [(ngModel)]="alumnoSeleccionado.apellido"
            placeholder="Apellidos"
            class="form-input">
        </div>

        <!-- Teléfono -->
        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <input 
            type="text" 
            id="telefono" 
            name="telefono" 
            [(ngModel)]="alumnoSeleccionado.telefono"
            placeholder="+34 123 456 789"
            class="form-input">
        </div>

        <!-- Correo Electrónico -->
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            [(ngModel)]="alumnoSeleccionado.email"
            placeholder="usuario@email.com"
            class="form-input">
        </div>

        <!-- Imagen de Perfil -->
        <div class="form-group">
          <label>Imagen de Perfil</label>
          <div class="image-upload">
            <img [src]="alumnoSeleccionado.imagenurl || 'assets/default-avatar.png'" alt="Perfil" class="preview-image">
            <button type="button" class="btn-upload" (click)="fileInput.click()">
              <i class="fas fa-cloud-upload-alt"></i> Subir Imagen
            </button>
            <input 
              #fileInput 
              type="file" 
              hidden 
              (change)="onImageSelected($event)"
              accept="image/*">
            <input 
              type="text" 
              [(ngModel)]="imagenNombre" 
              name="imagenNombre"
              placeholder="Nombre Imagen"
              class="form-input">
          </div>
        </div>

        <!-- Botones de Acción -->
        <div class="form-actions">
          <button type="submit" class="btn-save">
            {{ editando ? 'Actualizar Alumno' : 'Guardar Alumno' }}
          </button>
          <button type="button" class="btn-clear" (click)="limpiarFormulario()">Limpiar</button>
        </div>
      </form>
    </div>

    <!-- Panel Derecho: Tabla de Alumnos -->
    <div class="table-panel">
      <h2 class="table-title">LISTA DE ALUMNOS REGISTRADOS</h2>
      
      <!-- Búsqueda y Acción Nueva -->
      <div class="table-header">
        <div class="search-container">
          <i class="fas fa-search"></i>
          <input 
            type="text" 
            placeholder="Buscar por Nombre, ID, Correo..."
            [(ngModel)]="searchTerm"
            (input)="filtrarAlumnos()"
            class="search-input">
        </div>
        <button class="btn-new-alumno" (click)="nuevoAlumno()">
          <i class="fas fa-plus"></i> Nueva Persona
        </button>
      </div>

      <!-- Tabla -->
      <div class="table-wrapper">
        <table class="alumnos-table">
          <thead>
            <tr>
              <th>Foto</th>
              <th>ID</th>
              <th>Número de Control</th>
              <th>Nombre</th>
              <th>Apellido</th>
              <th>Teléfono</th>
              <th>Correo</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let alumno of alumnosEnPagina" class="table-row">
              <td class="cell-foto">
                <img [src]="alumno.imagenurl || 'assets/default-avatar.png'" alt="{{ alumno.nombre }}" class="table-avatar">
              </td>
              <td>{{ alumno.id }}</td>
              <td>{{ alumno.numeroControl }}</td>
              <td>{{ alumno.nombre }}</td>
              <td>{{ alumno.apellido }}</td>
              <td>{{ alumno.telefono }}</td>
              <td class="cell-email">{{ alumno.email }}</td>
              <td class="cell-acciones">
                <button class="btn-action edit" (click)="editarAlumno(alumno)" title="Editar">
                  <i class="fas fa-pencil-alt"></i>
                </button>
                <button class="btn-action delete" (click)="eliminarAlumno(alumno.id)" title="Eliminar">
                  <i class="fas fa-trash"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Paginación -->
      <div class="pagination">
        <button class="page-btn" (click)="previousPage()" [disabled]="currentPage === 1">
          <i class="fas fa-chevron-left"></i>
        </button>
        
        <button 
          *ngFor="let page of paginationPages" 
          class="page-btn" 
          [class.active]="page === currentPage"
          (click)="goToPage(page)">
          {{ page }}
        </button>
        
        <span class="page-dots" *ngIf="mostrarMasPaginacion">...</span>
        
        <button class="page-btn" (click)="nextPage()" [disabled]="currentPage === totalPages">
          <i class="fas fa-chevron-right"></i>
        </button>
      </div>
    </div>
  </div>
</div>
